services:
  - type: web
    name: scamtrace-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SCAMTRACE_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./scamtrace.db
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
